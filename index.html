<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsport Racer Career 2026</title>
    <style>
        :root {
            --bg: #0f0f12;
            --panel: #1a1a1e;
            --border: #2a2a30;
            --text: #e0e0e0;
            --accent: #e10600;
            --green: #00ff88;
            --yellow: #ffaa00;
            --red: #ff3b3b;
            --blue: #00aaff;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            justify-content: center;
            padding: 10px;
            min-height: 100vh;
        }
        #app {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .header h1 { font-size: 1.2rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .header .race-info { font-size: 0.8rem; color: #888; }
        
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        .card-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        /* Setup Screen */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .input-group label { font-size: 0.85rem; color: #aaa; }
        .input-group input, .input-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #111;
            color: #fff;
            font-size: 1rem;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #c00500; }
        .btn-secondary { background: #2a2a30; color: #e0e0e0; border: 1px solid #444; }
        .btn-secondary:hover { background: #333; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .stat-item {
            background: #111;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .stat-item .label { color: #888; }
        .stat-item .value { font-weight: 700; color: #fff; }

        /* Log */
        .log {
            height: 220px;
            overflow-y: auto;
            background: #08080a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .log p { margin-bottom: 4px; }
        .log .highlight { color: var(--yellow); }
        .log .success { color: var(--green); }
        .log .danger { color: var(--red); }
        .log .info { color: var(--blue); }

        /* Mode Buttons */
        .mode-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #111;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .mode-btn.active-safe { background: rgba(0,255,136,0.1); border-color: var(--green); color: var(--green); }
        .mode-btn.active-balanced { background: rgba(255,170,0,0.1); border-color: var(--yellow); color: var(--yellow); }
        .mode-btn.active-aggressive { background: rgba(255,59,59,0.1); border-color: var(--red); color: var(--red); }

        .action-buttons { display: flex; gap: 8px; }
        .action-buttons .btn { flex: 1; }
        
        .hidden { display: none !important; }
        
        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        .player-row { background: rgba(225,6,0,0.1); }
        .rival-row { background: rgba(0,170,255,0.1); }

        .trophies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .trophy-badge {
            background: #2a2a30;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            border: 1px solid #444;
            color: var(--yellow);
        }
    </style>
</head>
<body>
<div id="app">

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <div class="header">
            <h1>MRC 2026</h1>
            <div class="race-info">Новая карьера</div>
        </div>
        <div class="card">
            <div class="card-title">Создание пилота</div>
            <div class="input-group">
                <label>Имя пилота</label>
                <input type="text" id="p-name" placeholder="Введите имя" value="Никита">
                
                <label>Национальность</label>
                <select id="p-nat">
                    <option>Россия</option><option>Германия</option><option>Великобритания</option>
                    <option>Италия</option><option>Испания</option><option>Франция</option>
                    <option>Нидерланды</option><option>США</option><option>Япония</option>
                    <option>Австралия</option><option>Монако</option><option>Канада</option>
                </select>

                <label>Возраст (18-50)</label>
                <input type="number" id="p-age" min="18" max="50" value="20">

                <label>Команда</label>
                <select id="p-team">
                    <option value="Red Bull">Red Bull (95)</option>
                    <option value="Ferrari">Ferrari (94)</option>
                    <option value="Mercedes">Mercedes (93)</option>
                    <option value="McLaren">McLaren (92)</option>
                    <option value="Aston Martin">Aston Martin (88)</option>
                    <option value="Alpine">Alpine (85)</option>
                    <option value="Williams">Williams (84)</option>
                    <option value="Haas">Haas (80)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="initCareer()">Начать карьеру</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <div class="header">
            <h1 id="ui-track">MRC 2026</h1>
            <div class="race-info" id="ui-round">Раунд 1/24</div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-grid">
            <div class="stat-item"><span class="label">Пилот:</span> <span class="value" id="ui-name">-</span></div>
            <div class="stat-item"><span class="label">Команда:</span> <span class="value" id="ui-team">-</span></div>
            <div class="stat-item"><span class="label">Позиция:</span> <span class="value" id="ui-pos">-</span></div>
            <div class="stat-item"><span class="label">Двигатель:</span> <span class="value" id="ui-engine">100%</span></div>
            <div class="stat-item"><span class="label">Режим:</span> <span class="value" id="ui-mode">BALANCED</span></div>
            <div class="stat-item"><span class="label">Очки:</span> <span class="value" id="ui-points">0</span></div>
        </div>

        <!-- Trophy Room -->
        <div class="card" style="padding: 10px 15px;">
            <div class="card-title">Trophy Room</div>
            <div class="trophies" id="ui-trophies"><span style="color:#666; font-size:0.8rem;">Пока нет трофеев</span></div>
        </div>

        <!-- Race Log -->
        <div class="card">
            <div class="card-title">Лог событий</div>
            <div class="log" id="race-log"></div>

            <!-- Mode Selector -->
            <div class="mode-buttons" id="mode-selector">
                <button class="mode-btn" id="btn-safe" onclick="setMode('SAFE')">SAFE 🛡️</button>
                <button class="mode-btn" id="btn-balanced" onclick="setMode('BALANCED')">BALANCED ⚖️</button>
                <button class="mode-btn" id="btn-aggressive" onclick="setMode('AGGRESSIVE')">AGGRESSIVE 🔥</button>
            </div>

            <!-- Actions -->
            <div class="action-buttons" id="action-bar">
                <button class="btn btn-primary" id="btn-quali" onclick="runQualifying()">Квалификация</button>
                <button class="btn btn-primary hidden" id="btn-race" onclick="startRace()">Старт гонки</button>
                <button class="btn btn-secondary hidden" id="btn-next" onclick="nextRound()">Следующий этап</button>
            </div>
        </div>

        <!-- Championship Standings -->
        <div class="card">
            <div class="card-title">Чемпионат пилотов</div>
            <div class="table-container">
                <table id="standings-table">
                    <thead><tr><th>Поз</th><th>Пилот</th><th>Команда</th><th>Очки</th><th>Поб.</th><th>GOAT</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// ЛОГИКА ИГРЫ
// ==========================================

class Driver {
    constructor(name, nat, age, team, isPlayer = false) {
        this.name = name;
        this.nat = nat;
        this.age = age;
        this.team = team;
        this.isPlayer = isPlayer;
        
        // Статистика
        this.points = 0;
        this.wins = 0;
        this.podiums = 0;
        this.poles = 0;
        this.fastestLaps = 0;
        this.dnfs = 0;
        this.races = 0;
        this.trophies = []; // Trophy Room
        
        // Двигатель
        this.engine = 100.0;
        this.engineChanges = 3;
        
        // Характеристики от возраста
        if (age <= 20) {
            this.skill = 65 + Math.random() * 10;
            this.consistency = 55 + Math.random() * 15;
            this.aggression = 75 + Math.random() * 15;
        } else if (age <= 25) {
            this.skill = 75 + Math.random() * 10;
            this.consistency = 70 + Math.random() * 10;
            this.aggression = 65 + Math.random() * 15;
        } else if (age <= 30) {
            this.skill = 85 + Math.random() * 10;
            this.consistency = 80 + Math.random() * 10;
            this.aggression = 60 + Math.random() * 15;
        } else if (age <= 35) {
            this.skill = 80 + Math.random() * 10;
            this.consistency = 85 + Math.random() * 10;
            this.aggression = 55 + Math.random() * 15;
        } else {
            this.skill = 70 + Math.random() * 10;
            this.consistency = 85 + Math.random() * 10;
            this.aggression = 40 + Math.random() * 15;
        }

        // Для гонки
        this.currentPos = 1;
        this.gridPos = 1;
        this.raceTime = 0;
        this.dnf = false;
        this.mode = 'BALANCED';
    }

    getPerformance() {
        let speedMult = 1.0, wearMult = 1.0, spinChance = 0.03;
        if (this.mode === 'SAFE') { speedMult = 0.92; wearMult = 0.5; spinChance = 0.01; }
        else if (this.mode === 'AGGRESSIVE') { speedMult = 1.10; wearMult = 2.0; spinChance = 0.08; }

        let engineMod = this.engine / 100.0;
        if (engineMod < 0.6) engineMod = 0.5 + (engineMod - 0.6) * 0.5;
        
        let ageMod = 1.0;
        if (this.age < 22) ageMod = 0.95;
        else if (this.age > 35) ageMod = 1.0 - (this.age - 35) * 0.015;

        let base = (this.skill * 0.7 + this.consistency * 0.3) * speedMult * engineMod * ageMod;
        return { perf: Math.max(10, base * (0.9 + Math.random() * 0.2)), wear: wearMult, spin: spinChance };
    }

    getGoatScore() {
        return (this.wins * 500) + (this.podiums * 200) + (this.poles * 100) + (this.points * 10);
    }
}

// Глобальное состояние
let player = null;
let opponents = [];
let rival = null;
let currentRound = 0;
const calendar = ["Бахрейн", "Саудовская Аравия", "Австралия", "Япония", "Китай", "Майами", "Монако", "Канада", "Испания", "Великобритания", "Венгрия", "Бельгия", "Италия", "Сингапур", "США", "Мексика", "Бразилия", "Абу-Даби"];
let raceState = { qualified: false, raced: false };

// Инициализация
function initCareer() {
    const name = document.getElementById('p-name').value || "Пилот";
    const nat = document.getElementById('p-nat').value;
    const age = parseInt(document.getElementById('p-age').value);
    const team = document.getElementById('p-team').value;

    if (age < 18 || age > 50) { alert("Возраст должен быть от 18 до 50!"); return; }

    player = new Driver(name, nat, age, team, true);
    
    // Генерация ИИ-пилотов
    const aiNames = ["М. Ферстаппен", "Л. Хэмилтон", "Ш. Леклер", "Л. Норрис", "О. Пиастри", "Дж. Расселл", "К. Сайнс", "Ф. Алонсо", "П. Гасли", "Э. Окон", "А. Албон", "Ю. Цунода"];
    const teams = ["Red Bull", "Ferrari", "Mercedes", "McLaren", "Aston Martin", "Alpine", "Williams", "Haas"];
    
    opponents = [];
    aiNames.forEach((n, i) => {
        let aiTeam = teams[i % teams.length];
        // Избегаем дублирования команды игрока
        if (aiTeam === team) aiTeam = teams[(i+1) % teams.length];
        let ai = new Driver(n, "Мир", Math.floor(Math.random() * 27) + 18, aiTeam);
        if (i < 4) { ai.skill += 8; ai.consistency += 5; } // Топ-пилоты сильнее
        opponents.push(ai);
    });

    // Назначаем сезонного соперника
    rival = opponents[Math.floor(Math.random() * opponents.length)];

    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    
    log(`Добро пожаловать в MRC 2026!`, "highlight");
    log(`Пилот: ${player.name} | Команда: ${player.team} | Возраст: ${player.age}`);
    log(`Сезонный соперник: ${rival.name} (${rival.team})`, "info");
    log("Нажмите 'Квалификация', чтобы начать уик-энд.");
    
    updateUI();
}

// Обновление интерфейса
function updateUI() {
    if (!player) return;
    
    document.getElementById('ui-name').innerText = player.name;
    document.getElementById('ui-team').innerText = player.team;
    document.getElementById('ui-pos').innerText = player.currentPos ? `P${player.currentPos}` : "-";
    document.getElementById('ui-engine').innerText = `${player.engine.toFixed(0)}%`;
    document.getElementById('ui-mode').innerText = player.mode;
    document.getElementById('ui-points').innerText = player.points;
    
    // Цвет двигателя
    const engEl = document.getElementById('ui-engine');
    if (player.engine < 60) engEl.style.color = "var(--red)";
    else if (player.engine < 80) engEl.style.color = "var(--yellow)";
    else engEl.style.color = "var(--green)";

    // Кнопки режимов
    document.querySelectorAll('.mode-btn').forEach(b => b.className = 'mode-btn');
    if (player.mode === 'SAFE') document.getElementById('btn-safe').classList.add('active-safe');
    else if (player.mode === 'BALANCED') document.getElementById('btn-balanced').classList.add('active-balanced');
    else document.getElementById('btn-aggressive').classList.add('active-aggressive');

    // Трофеи
    const troEl = document.getElementById('ui-trophies');
    if (player.trophies.length === 0) {
        troEl.innerHTML = '<span style="color:#666; font-size:0.8rem;">Пока нет трофеев</span>';
    } else {
        troEl.innerHTML = player.trophies.map(t => `<span class="trophy-badge">🏆 ${t}</span>`).join('');
    }

    // Таблица
    updateStandings();
}

function updateStandings() {
    const tbody = document.querySelector('#standings-table tbody');
    const allDrivers = [player, ...opponents].sort((a, b) => b.points - a.points || b.getGoatScore() - a.getGoatScore());
    
    tbody.innerHTML = allDrivers.map((d, i) => {
        let rowClass = d.isPlayer ? 'player-row' : (d === rival ? 'rival-row' : '');
        return `<tr class="${rowClass}">
            <td>${i + 1}</td>
            <td>${d.name} ${d.isPlayer ? '👤' : (d === rival ? '⚔️' : '')}</td>
            <td>${d.team}</td>
            <td>${d.points}</td>
            <td>${d.wins}</td>
            <td>${d.getGoatScore()}</td>
        </tr>`;
    }).join('');
}

function log(msg, type = '') {
    const logEl = document.getElementById('race-log');
    const p = document.createElement('p');
    p.innerText = msg;
    if (type) p.className = type;
    logEl.appendChild(p);
    logEl.scrollTop = logEl.scrollHeight;
}

function setMode(mode) {
    player.mode = mode;
    log(`Режим изменен на: ${mode}`, mode === 'AGGRESSIVE' ? 'danger' : (mode === 'SAFE' ? 'success' : 'highlight'));
    updateUI();
}

// ================= КВАЛИФИКАЦИЯ =================
function runQualifying() {
    log(`--- КВАЛИФИКАЦИЯ: ${calendar[currentRound]} ---`, "highlight");
    document.getElementById('btn-quali').disabled = true;
    
    let results = [];
    [player, ...opponents].forEach(d => {
        if (d.engine < 20) { log(`${d.name} не допущен к квале (двигатель < 20%)`, "danger"); return; }
        let baseTime = 90.0 - (d.skill * 0.2) + (100 - d.engine) * 0.1;
        let finalTime = baseTime + (0.1 + Math.random() * 0.8);
        results.push({ driver: d, time: finalTime });
    });

    results.sort((a, b) => a.time - b.time);
    results.forEach((r, i) => {
        r.driver.gridPos = i + 1;
        r.driver.currentPos = i + 1;
        if (i === 0) r.driver.poles++;
    });

    log(`Вы квалифицировались на P${player.gridPos}`, player.gridPos <= 3 ? "success" : "");
    document.getElementById('btn-quali').classList.add('hidden');
    document.getElementById('btn-race').classList.remove('hidden');
    updateUI();
}

// ================= ГОНКА =================
function startRace() {
    log(`--- ГОНКА: ${calendar[currentRound]} ---`, "danger");
    document.getElementById('btn-race').disabled = true;
    
    // Симуляция старта
    let reaction = Math.random() * 0.8;
    let bonus = 0;
    if (reaction < 0.2) { bonus = 2; log("Отличная реакция на старте! +2 позиции", "success"); }
    else if (reaction > 0.6) { bonus = -2; log("Плохая реакция! -2 позиции", "danger"); }
    
    player.currentPos = Math.max(1, Math.min(20, player.gridPos - bonus));

    // Симуляция кругов
    let participants = [player, ...opponents].filter(d => d.engine >= 20);
    participants.forEach(d => { d.raceTime = 0; d.dnf = false; d.mode = d.isPlayer ? player.mode : 'BALANCED'; });

    for (let lap = 1; lap <= 52; lap++) {
        participants.forEach(d => {
            if (d.dnf) return;
            let perf = d.getPerformance();
            d.raceTime += (1000.0 / perf.perf) * 0.1;
            d.engine -= perf.wear * 0.15;
            if (d.engine < 0) d.engine = 0;
            
            if (Math.random() < perf.spin) {
                d.raceTime += 2.0;
                if (d.isPlayer) log(`Спин на круге ${lap}! Потеря времени.`, "highlight");
            }
            if (d.engine < 5 && Math.random() < 0.01) {
                d.dnf = true;
                if (d.isPlayer) log("СХОД! Двигатель отказал.", "danger");
            }
        });
        
        // Обновление позиций на каждом круге
        let active = participants.filter(d => !d.dnf).sort((a, b) => a.raceTime - b.raceTime);
        active.forEach((d, i) => d.currentPos = i + 1);
    }

    // Финиш
    let final = participants.filter(d => !d.dnf).sort((a, b) => a.raceTime - b.raceTime);
    
    player.races++;
    final.forEach((d, i) => {
        let pos = i + 1;
        if (pos === 1) d.wins++;
        if (pos <= 3) d.podiums++;
        
        let pts = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1][pos - 1] || 0;
        d.points += pts;
    });

    // Быстрый круг
    if (final.length > 0) {
        let fl = final[0]; // Упрощенно: победитель получает быстрый круг
        fl.fastestLaps++;
        if (fl.isPlayer) log("🏆 Вы показали быстрейший круг гонки!", "success");
    }

    let pPos = final.findIndex(d => d.isPlayer) + 1;
    log(`ФИНИШ! Вы закончили гонку на P${pPos}`, pPos <= 3 ? "success" : "");
    
    if (pPos === 1) {
        log("🏆 ПОБЕДА! Трофей добавлен в комнату трофеев.", "success");
        player.trophies.push(calendar[currentRound]);
    }

    // Сравнение с соперником
    let rivalPos = final.findIndex(d => d === rival) + 1;
    if (rivalPos > pPos) log(`Вы обошли своего соперника ${rival.name} в гонке!`, "info");
    else if (rivalPos < pPos) log(`Соперник ${rival.name} финишировал впереди вас.`, "danger");

    // Проверка двигателя
    if (player.engine < 90 && player.engineChanges > 0) {
        log(`Внимание: Двигатель изношен (${player.engine.toFixed(0)}%). Осталось замен: ${player.engineChanges}`, "highlight");
    }

    document.getElementById('btn-next').classList.remove('hidden');
    updateUI();
}

// ================= ПЕРЕХОД К СЛЕДУЮЩЕМУ ЭТАПУ =================
function nextRound() {
    // Замена двигателя между гонками
    if (player.engine < 90 && player.engineChanges > 0) {
        if (confirm(`Состояние двигателя: ${player.engine.toFixed(0)}%. Заменить двигатель? (Осталось: ${player.engineChanges})`)) {
            player.engine = 100;
            player.engineChanges--;
            log("Двигатель заменен! Мощность восстановлена.", "success");
        }
    }
    
    currentRound++;
    if (currentRound >= calendar.length) {
        log("--- СЕЗОН ЗАВЕРШЕН! ---", "danger");
        log(`Ваши очки: ${player.points} | Победы: ${player.wins} | Подиумы: ${player.podiums}`, "highlight");
        log(`GOAT Score: ${player.getGoatScore()}`, "highlight");
        document.getElementById('btn-next').disabled = true;
        return;
    }

    player.currentPos = 1;
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-quali').classList.remove('hidden');
    document.getElementById('btn-quali').disabled = false;
    document.getElementById('btn-race').classList.add('hidden');
    document.getElementById('btn-race').disabled = false;
    
    document.getElementById('race-log').innerHTML = '';
    log(`--- СЛЕДУЮЩИЙ ЭТАП: ${calendar[currentRound]} ---`, "info");
    updateUI();
}
</script>
</body>
</html>
