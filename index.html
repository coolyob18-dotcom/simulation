 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorsport Racer Career 2026</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        #game-container {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1, h2, h3 {
            color: #ff3b3b;
            text-align: center;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }
        .stat-value { font-weight: bold; color: #fff; }
        .log {
            height: 250px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .log p { margin: 4px 0; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: 0.2s;
            min-width: 100px;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-main { background-color: #ff3b3b; color: white; }
        .btn-main:hover:not(:disabled) { background-color: #d32f2f; }
        .btn-sec { background-color: #333; color: #eee; }
        .btn-sec:hover:not(:disabled) { background-color: #444; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 1em;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🏎️ MRC 2026</h1>

    <!-- Экран настройки -->
    <div id="setup-screen">
        <div class="input-group">
            <label>Имя пилота:</label>
            <input type="text" id="p-name" placeholder="Введите имя" value="Никита">
            
            <label>Национальность:</label>
            <select id="p-nat">
                <option value="Россия">Россия</option>
                <option value="Германия">Германия</option>
                <option value="Великобритания">Великобритания</option>
                <option value="Италия">Италия</option>
                <option value="Испания">Испания</option>
                <option value="США">США</option>
                <option value="Япония">Япония</option>
            </select>

            <label>Возраст (18-50):</label>
            <input type="number" id="p-age" min="18" max="50" value="20">

            <label>Команда:</label>
            <select id="p-team">
                <option value="Red Bull">Red Bull (95)</option>
                <option value="Ferrari">Ferrari (94)</option>
                <option value="Mercedes">Mercedes (93)</option>
                <option value="McLaren">McLaren (92)</option>
                <option value="Aston Martin">Aston Martin (88)</option>
                <option value="Alpine">Alpine (85)</option>
                <option value="Haas">Haas (80)</option>
            </select>
        </div>
        <button class="btn-main" onclick="startCareer()">НАЧАТЬ КАРЬЕРУ</button>
    </div>

    <!-- Экран гонки -->
    <div id="race-screen" class="hidden">
        <div class="stats-grid">
            <div class="stat-item"><span>Пилот:</span> <span class="stat-value" id="ui-name">-</span></div>
            <div class="stat-item"><span>Команда:</span> <span class="stat-value" id="ui-team">-</span></div>
            <div class="stat-item"><span>Позиция:</span> <span class="stat-value" id="ui-pos">-</span></div>
            <div class="stat-item"><span>Двигатель:</span> <span class="stat-value" id="ui-engine">100%</span></div>
            <div class="stat-item"><span>Режим:</span> <span class="stat-value" id="ui-mode">BALANCED</span></div>
            <div class="stat-item"><span>Очки:</span> <span class="stat-value" id="ui-points">0</span></div>
        </div>

        <div class="log" id="race-log"></div>

        <div class="controls" id="race-controls">
            <button class="btn-sec" onclick="setMode('SAFE')">SAFE 🛡️</button>
            <button class="btn-main" onclick="setMode('BALANCED')">BALANCED ⚖️</button>
            <button class="btn-sec" onclick="setMode('AGGRESSIVE')">AGGRESSIVE 🔥</button>
        </div>
        <div class="controls" id="action-controls" style="margin-top: 10px;">
            <button class="btn-main" id="btn-quali" onclick="runQualifying()">КВАЛИФИКАЦИЯ</button>
            <button class="btn-main hidden" id="btn-race" onclick="startRace()">СТАРТ ГОНКИ</button>
            <button class="btn-main hidden" id="btn-next" onclick="nextRace()">СЛЕДУЮЩИЙ ЭТАП</button>
        </div>
    </div>
</div>

<script>
    // --- Классы и Логика ---
    
    class Driver {
        constructor(name, nat, age, team, isPlayer = false) {
            this.name = name;
            this.nat = nat;
            this.age = age;
            this.team = team;
            this.isPlayer = isPlayer;
            this.points = 0;
            this.engine = 100;
            this.engineChanges = 3;
            this.wins = 0;
            this.podiums = 0;
            this.poles = 0;
            this.dnf = false;
            this.raceTime = 0;
            this.currentPos = 1;
            this.mode = 'BALANCED';
            
            // Генерация характеристик от возраста
            if (age <= 20) {
                this.skill = 65 + Math.random() * 10;
                this.consistency = 55 + Math.random() * 15;
                this.aggression = 75 + Math.random() * 15;
            } else if (age <= 25) {
                this.skill = 75 + Math.random() * 10;
                this.consistency = 70 + Math.random() * 10;
                this.aggression = 65 + Math.random() * 15;
            } else if (age <= 30) {
                this.skill = 85 + Math.random() * 10;
                this.consistency = 80 + Math.random() * 10;
                this.aggression = 60 + Math.random() * 15;
            } else if (age <= 35) {
                this.skill = 80 + Math.random() * 10;
                this.consistency = 85 + Math.random() * 10;
                this.aggression = 55 + Math.random() * 15;
            } else {
                this.skill = 70 + Math.random() * 10;
                this.consistency = 85 + Math.random() * 10;
                this.aggression = 40 + Math.random() * 15;
            }
        }

        getPerformance() {
            let speedMult = 1.0;
            let wearMult = 1.0;
            let spinChance = 0.03;

            if (this.mode === 'SAFE') {
                speedMult = 0.92; wearMult = 0.5; spinChance = 0.01;
            } else if (this.mode === 'AGGRESSIVE') {
                speedMult = 1.10; wearMult = 2.0; spinChance = 0.08;
            }

            let engineMod = this.engine / 100.0;
            if (engineMod < 0.6) engineMod = 0.5 + (engineMod - 0.6) * 0.5;
            
            let ageMod = 1.0;
            if (this.age < 22) ageMod = 0.95;
            else if (this.age > 35) ageMod = 1.0 - (this.age - 35) * 0.015;

            let base = (this.skill * 0.7 + this.consistency * 0.3) * speedMult * engineMod * ageMod;
            let rand = 0.9 + Math.random() * 0.2;
            
            return { perf: Math.max(10, base * rand), wear: wearMult, spin: spinChance };
        }
    }

    // --- Глобальное состояние игры ---
    let player = null;
    let opponents = [];
    let currentRaceIndex = 0;
    const calendar = ["Бахрейн", "Саудовская Аравия", "Австралия", "Япония", "Китай", "Майами", "Монако", "Канада", "Испания", "Великобритания", "Венгрия", "Бельгия", "Италия", "Сингапур", "США", "Мексика", "Бразилия", "Абу-Даби"];
    let raceStarted = false;

    // --- Инициализация ---
    function startCareer() {
        const name = document.getElementById('p-name').value || "Пилот";
        const nat = document.getElementById('p-nat').value;
        const age = parseInt(document.getElementById('p-age').value);
        const team = document.getElementById('p-team').value;

        if (age < 18 || age > 50) { alert("Возраст должен быть от 18 до 50!"); return; }

        player = new Driver(name, nat, age, team, true);
        
        // Генерация соперников
        const aiNames = ["Ферстаппен", "Хэмилтон", "Леклер", "Норрис", "Пиастри", "Расселл", "Сайнс", "Алонсо", "Гасли", "Окон"];
        opponents = [];
        aiNames.forEach(n => {
            let aiTeam = ["Red Bull", "Ferrari", "Mercedes", "McLaren", "Aston Martin"][Math.floor(Math.random() * 5)];
            let ai = new Driver(n, "Мир", Math.floor(Math.random() * 27) + 18, aiTeam);
            if (n === "Ферстаппен" || n === "Хэмилтон") ai.skill += 5;
            opponents.push(ai);
        });

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('race-screen').classList.remove('hidden');
        
        updateUI();
        log("Добро пожаловать в MRC 2026! Ваш путь начинается.");
        log(`Пилот: ${player.name} | Команда: ${player.team} | Возраст: ${player.age}`);
        log("Нажмите 'КВАЛИФИКАЦИЯ', чтобы начать уик-энд.");
    }

    function updateUI() {
        if (!player) return;
        document.getElementById('ui-name').innerText = player.name;
        document.getElementById('ui-team').innerText = player.team;
        document.getElementById('ui-pos').innerText = "P" + player.currentPos;
        document.getElementById('ui-engine').innerText = player.engine.toFixed(0) + "%";
        document.getElementById('ui-mode').innerText = player.mode;
        document.getElementById('ui-points').innerText = player.points;
        
        // Цвет двигателя
        const engEl = document.getElementById('ui-engine');
        if (player.engine < 60) engEl.style.color = "#ff3b3b";
        else if (player.engine < 80) engEl.style.color = "#ffaa00";
        else engEl.style.color = "#00ff88";
    }

    function log(msg, color = null) {
        const logEl = document.getElementById('race-log');
        const p = document.createElement('p');
        p.innerText = msg;
        if (color) p.style.color = color;
        logEl.appendChild(p);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function setMode(mode) {
        player.mode = mode;
        log(`Режим изменен на: ${mode}`, mode === 'AGGRESSIVE' ? '#ff3b3b' : (mode === 'SAFE' ? '#00ff88' : '#ffaa00'));
        updateUI();
    }

    function runQualifying() {
        log(`--- КВАЛИФИКАЦИЯ: ${calendar[currentRaceIndex]} ---`, "#ffaa00");
        
        let results = [];
        [player, ...opponents].forEach(d => {
            if (d.engine < 20) return;
            let baseTime = 90.0 - (d.skill * 0.2) + (100 - d.engine) * 0.1;
            let rand = 0.1 + Math.random() * 0.8;
            results.push({ driver: d, time: baseTime + rand });
        });

        results.sort((a, b) => a.time - b.time);
        results.forEach((r, i) => {
            r.driver.currentPos = i + 1;
            if (i === 0) r.driver.poles++;
        });

        player.gridPos = player.currentPos;
        log(`Вы квалифицировались на P${player.gridPos}`);
        
        document.getElementById('btn-quali').classList.add('hidden');
        document.getElementById('btn-race').classList.remove('hidden');
        updateUI();
    }

    function startRace() {
        log(`--- ГОНКА: ${calendar[currentRaceIndex]} ---`, "#ff3b3b");
        document.getElementById('btn-race').classList.add('hidden');
        
        // Симуляция старта
        let startBonus = Math.floor(Math.random() * 4) - 1; // -1 до +2
        player.currentPos = Math.max(1, Math.min(20, player.gridPos - startBonus));
        log(`Старт! Реакция: ${startBonus > 0 ? 'Отличная' : 'Средняя'}. Позиция: P${player.currentPos}`);
        
        // Гонка
        let participants = [player, ...opponents].filter(d => d.engine >= 20);
        participants.forEach(d => {
            d.raceTime = 0;
            d.dnf = false;
            if (d.isPlayer) d.startPos = d.currentPos;
        });

        // Обработка старта (позиции)
        let sortedStart = participants.slice().sort((a, b) => a.currentPos - b.currentPos);
        
        // Симуляция кругов (упрощенно 52 круга)
        for (let lap = 1; lap <= 52; lap++) {
            participants.forEach(d => {
                if (d.dnf) return;
                
                let perf = d.getPerformance();
                d.raceTime += (1000.0 / perf.perf) * 0.1;
                d.engine -= perf.wear * 0.15;
                if (d.engine < 0) d.engine = 0;
                
                if (Math.random() < perf.spin) {
                    d.raceTime += 1.5;
                    if (d.isPlayer) log(`Спин на круге ${lap}! Потеря времени.`, "#ffaa00");
                }
                
                if (d.engine < 5 && Math.random() < 0.01) {
                    d.dnf = true;
                    if (d.isPlayer) log(`СХОД! Двигатель отказал.`, "#ff3b3b");
                }
            });
            
            // Обновление позиций
            let active = participants.filter(d => !d.dnf).sort((a, b) => a.raceTime - b.raceTime);
            active.forEach((d, i) => d.currentPos = i + 1);
        }

        // Финиш
        let final = participants.filter(d => !d.dnf).sort((a, b) => a.raceTime - b.raceTime);
        
        player.races = (player.races || 0) + 1;
        final.forEach((d, i) => {
            let pos = i + 1;
            if (pos === 1) d.wins++;
            if (pos <= 3) d.podiums++;
            
            let points = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1][pos - 1] || 0;
            d.points += points;
        });
        
        let pPos = final.findIndex(d => d.isPlayer) + 1;
        log(`ФИНИШ! Вы закончили гонку на P${pPos}`, pPos <= 3 ? "#00ff88" : "white");
        
        if (pPos === 1) log("🏆 ПОБЕДА! Вы лучший на этой трассе!", "#ffaa00");
        
        // Проверка замены двигателя
        if (player.engine < 90 && player.engineChanges > 0) {
            log(`Внимание: Двигатель изношен (${player.engine.toFixed(0)}%). Осталось замен: ${player.engineChanges}`, "#ffaa00");
        } else if (player.engine < 60) {
            log("Критический износ двигателя! Машина теряет скорость.", "#ff3b3b");
        }

        document.getElementById('btn-next').classList.remove('hidden');
        updateUI();
    }

    function nextRace() {
        // Замена двигателя между гонками (упрощенно)
        if (player.engine < 90 && player.engineChanges > 0) {
            if (confirm(`Состояние двигателя: ${player.engine.toFixed(0)}%. Заменить двигатель? (Осталось: ${player.engineChanges})`)) {
                player.engine = 100;
                player.engineChanges--;
                log("Двигатель заменен! Мощность восстановлена.", "#00ff88");
            }
        }
        
        currentRaceIndex++;
        if (currentRaceIndex >= calendar.length) {
            log("--- СЕЗОН ЗАВЕРШЕН! ---", "#ff3b3b");
            log(`Ваши очки: ${player.points} | Победы: ${player.wins} | Подиумы: ${player.podiums}`, "#ffaa00");
            document.getElementById('btn-next').disabled = true;
            return;
        }

        player.currentPos = 1; // Сброс для квалы
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-quali').classList.remove('hidden');
        document.getElementById('race-log').innerHTML = ''; // Очистка лога
        log(`--- СЛЕДУЮЩИЙ ЭТАП: ${calendar[currentRaceIndex]} ---`);
        updateUI();
    }
</script>
</body>
            </html>
